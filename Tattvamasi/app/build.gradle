apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// The release signing key's details live outside git: Tattvamasi/keystore.properties (git-ignored) with
// storeFile, storePassword, keyAlias and keyPassword, or the same names as environment variables
// (TATTVAMASI_STORE_FILE, ...). Without them, release builds are left unsigned.
def keystoreProperties = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProperties.load(it) }
}
def signingValue = { String name, String env -> keystoreProperties.getProperty(name) ?: System.getenv(env) }
def releaseStoreFile = signingValue('storeFile', 'TATTVAMASI_STORE_FILE')

android {
    namespace 'com.ayyappasamaaj.tattvamasi'
    compileSdk 35

    defaultConfig {
        applicationId "com.ayyappasamaaj.tattvamasi"
        // Android 8 and up (the redesign, Nov 2026): Compose, adaptive layouts and variable fonts
        minSdk 26
        targetSdk 35
        versionCode 33
        versionName "3.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword signingValue('storePassword', 'TATTVAMASI_STORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'TATTVAMASI_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'TATTVAMASI_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStoreFile) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    // The new screens: Jetpack Compose with Material 3 and its adaptive navigation
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material3:material3-adaptive-navigation-suite'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.browser:browser:1.8.0'  // Custom Tabs for the website's pages
    // Pictures from the website (events' covers, the guides), cached on the device
    implementation 'io.coil-kt.coil3:coil-compose:3.0.4'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.0.4'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation "androidx.core:core-ktx:1.15.0"

    // Firebase (the website publishes events and publications there)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-messaging'  // push notifications from the website (topics)

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'  // reads the sample /publications in tests
    androidTestImplementation 'androidx.test:runner:1.6.2'
}

apply plugin: 'com.google.gms.google-services'
